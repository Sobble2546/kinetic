[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-compiler"
version = "1.3.0"
description = "A small Python compiler for Kinetic, targeting LLVM IR"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
kinetic = "compiler.cli:main"

[tool.setuptools]
packages = ["compiler"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
